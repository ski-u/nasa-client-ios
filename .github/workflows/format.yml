name: Format

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer

jobs:
  format:
    runs-on: xcode-27
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run swift-format
        run: swift format . --in-place --recursive --configuration .swift-format
      - uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          commit-message: run swift-format
          delete-branch: true
          title: Run swift-format
          reviewers: ski-u
          branch: run-swift-format
